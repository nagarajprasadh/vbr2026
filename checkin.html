<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VBR 2026 — Check-in</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif:wght@700&display=swap');
  :root {
    --saffron: #FF6600; --saffron-dark: #CC5200; --saffron-light: #FFF0E6;
    --india-green: #138808; --india-green-light: #E8F5E9;
    --navy: #0A1E3C; --navy-mid: #1A3A5C;
    --white: #FFFFFF; --grey-50: #F8F9FA; --grey-100: #F1F3F5;
    --grey-300: #CED4DA; --grey-500: #6C757D; --grey-700: #343A40;
    --error: #C0392B; --radius: 10px; --shadow: 0 2px 14px rgba(10,30,60,0.09);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--grey-50); color: var(--grey-700); min-height: 100vh; }

  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
    color: var(--white); padding: 20px 24px 18px; position: relative;
  }
  header::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--saffron) 33.3%, var(--white) 33.3%, var(--white) 66.6%, var(--india-green) 66.6%);
  }
  header h1 { font-family: 'Noto Serif', serif; font-size: 1.1rem; font-weight: 700; }
  header p { font-size: 0.78rem; opacity: 0.75; margin-top: 2px; }

  main { max-width: 560px; margin: 28px auto; padding: 0 16px 60px; }

  .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

  .search-area { padding: 24px; }
  .search-area h2 { font-size: 1rem; font-weight: 600; color: var(--navy); margin-bottom: 4px; }
  .search-area p { font-size: 0.82rem; color: var(--grey-500); margin-bottom: 18px; }

  .search-row { display: flex; gap: 8px; }
  .search-row input {
    flex: 1; padding: 11px 14px; border: 1.5px solid var(--grey-300);
    border-radius: 7px; font-family: 'Inter', sans-serif; font-size: 0.92rem;
    color: var(--grey-700); background: var(--white);
  }
  .search-row input:focus { outline: none; border-color: var(--saffron); }
  .btn-search {
    background: var(--saffron); color: var(--white); border: none;
    border-radius: 7px; padding: 11px 18px; font-size: 0.9rem; font-weight: 600;
    cursor: pointer; font-family: 'Inter', sans-serif; white-space: nowrap;
  }
  .btn-search:hover { background: var(--saffron-dark); }

  .divider { height: 1px; background: var(--grey-100); }

  .result-area { padding: 20px 24px; display: none; }
  .result-area.active { display: block; }

  .alert {
    padding: 12px 16px; border-radius: 7px; font-size: 0.85rem; margin-bottom: 14px;
  }
  .alert-error { background: #FDECEA; color: var(--error); border-left: 3px solid var(--error); }
  .alert-success { background: var(--india-green-light); color: var(--india-green); border-left: 3px solid var(--india-green); }
  .alert-info { background: var(--saffron-light); color: var(--saffron-dark); border-left: 3px solid var(--saffron); }

  .reg-card { border: 1.5px solid var(--grey-100); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  .reg-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .reg-card-email { font-size: 0.92rem; font-weight: 600; color: var(--navy); }
  .reg-card-id { font-size: 0.72rem; color: var(--grey-500); margin-top: 2px; }
  .badge {
    font-size: 0.72rem; font-weight: 600; padding: 3px 10px;
    border-radius: 20px; white-space: nowrap;
  }
  .badge-pending { background: var(--saffron-light); color: var(--saffron-dark); }
  .badge-done { background: var(--india-green-light); color: var(--india-green); }

  .participant-list { margin-bottom: 12px; }
  .participant-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid var(--grey-100); font-size: 0.85rem;
  }
  .participant-row:last-child { border-bottom: none; }
  .p-name { flex: 1; font-weight: 500; }
  .p-meta { color: var(--grey-500); font-size: 0.78rem; }

  .btn-checkin {
    background: var(--india-green); color: var(--white); border: none;
    border-radius: 7px; padding: 10px 18px; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; font-family: 'Inter', sans-serif; width: 100%;
    transition: background 0.15s;
  }
  .btn-checkin:hover { background: #0E6B06; }
  .btn-checkin:disabled { background: var(--grey-300); cursor: not-allowed; }
  .btn-checkin.done { background: var(--grey-300); cursor: default; }

  .loader { text-align: center; padding: 16px; color: var(--grey-500); font-size: 0.85rem; display: none; }
  .loader.active { display: block; }
  .spinner { width: 22px; height: 22px; border: 3px solid var(--grey-200); border-top-color: var(--saffron); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .stats-strip {
    display: flex; gap: 0;
    background: var(--grey-50); border-top: 1px solid var(--grey-100);
  }
  .stat-cell { flex: 1; text-align: center; padding: 14px 8px; }
  .stat-cell .sv { font-size: 1.4rem; font-weight: 700; color: var(--navy); }
  .stat-cell .sl { font-size: 0.72rem; color: var(--grey-500); margin-top: 2px; }
  .stat-cell + .stat-cell { border-left: 1px solid var(--grey-100); }

  .footer-nav { text-align: center; margin-top: 20px; display: flex; justify-content: center; gap: 20px; font-size: 0.8rem; }
  .footer-nav a { color: var(--grey-500); text-decoration: none; }
  .footer-nav a:hover { color: var(--saffron); }
  .footer-nav a.active { color: var(--saffron); font-weight: 600; }


</style>
</head>
<body>


<header>
  <h1>🏃 Viksit Bharat Run 2026 — Check-in</h1>
  <p>Wednesday, 30 September 2026 · Bangkok, Thailand</p>
</header>

<main>
  <div class="card">
    <div class="stats-strip" id="statsStrip">
      <div class="stat-cell"><div class="sv" id="csTotal">—</div><div class="sl">Registered</div></div>
      <div class="stat-cell"><div class="sv" id="csChecked">—</div><div class="sl">Checked In</div></div>
      <div class="stat-cell"><div class="sv" id="csPending">—</div><div class="sl">Pending</div></div>
    </div>

    <div class="divider"></div>

    <div class="search-area">
      <h2>Search Registration</h2>
      <p>Search by email address or registration ID.</p>
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Email or Registration ID" onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn-search" onclick="doSearch()">Search</button>
      </div>
    </div>

    <div class="loader" id="loader"><div class="spinner"></div>Searching…</div>

    <div class="divider"></div>

    <div class="result-area" id="resultArea">
      <div id="resultContent"></div>
    </div>
  </div>

  <div class="footer-nav">
    <a href="index.html">Registration</a>
    <a href="checkin.html" class="active">Check-in</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="admin.html">Admin</a>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD10Uvnqg6Q_kAQbOdjEjhtY7QBnP8vFGc",
    authDomain: "viksitbharatrunbkk2026.firebaseapp.com",
    databaseURL: "https://viksitbharatrunbkk2026-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "viksitbharatrunbkk2026",
    storageBucket: "viksitbharatrunbkk2026.firebasestorage.app",
    messagingSenderId: "732438557121",
    appId: "1:732438557121:web:c41053238a31f5c2af3f40"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window._db = db;
  window._ref = ref;
  window._get = get;
  window._set = set;

  loadStats();

  function loadStats() {
    onValue(ref(db, 'vbr2026/registrations'), snap => {
      const all = snap.val() || {};
      const regs = Object.values(all);
      const total = regs.length;
      const checked = regs.filter(r => r.checkedIn).length;
      document.getElementById('csTotal').textContent = total;
      document.getElementById('csChecked').textContent = checked;
      document.getElementById('csPending').textContent = total - checked;
    });
  }

  window.doSearch = async function() {
    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    if (!q) return;

    document.getElementById('loader').classList.add('active');
    document.getElementById('resultArea').classList.remove('active');

    const snap = await get(ref(db, 'vbr2026/registrations'));
    const all = snap.val() || {};

    const matches = Object.entries(all).filter(([k, v]) =>
      (v.email && v.email.toLowerCase().includes(q)) || k.toLowerCase() === q
    );

    document.getElementById('loader').classList.remove('active');
    document.getElementById('resultArea').classList.add('active');

    if (!matches.length) {
      document.getElementById('resultContent').innerHTML =
        `<div class="alert alert-error">No registration found for "${q}".</div>`;
      return;
    }

    document.getElementById('resultContent').innerHTML = matches.map(([k, v]) => {
      const p = v.participant || {};
      const done = v.checkedIn;
      return `
        <div class="reg-card">
          <div class="reg-card-header">
            <div>
              <div class="reg-card-email">${v.email}</div>
              <div class="reg-card-id">REG # ${k}</div>
            </div>
            <span class="badge ${done ? 'badge-done' : 'badge-pending'}">${done ? '✓ Checked In' : 'Pending'}</span>
          </div>
          <div class="participant-list">
            <div class="participant-row">
              <span class="p-name">${p.name || '—'}</span>
              <span class="p-meta">${p.idType || ''} ${p.idNumber || ''} · ${p.size || ''}</span>
            </div>
            <div class="participant-row" style="border-bottom:none;">
              <span class="p-meta" style="color:var(--grey-500);">📱 ${v.mobile || '—'}</span>
            </div>
          </div>
          <button class="btn-checkin ${done ? 'done' : ''}" ${done ? 'disabled' : ''} onclick="doCheckin('${k}')">
            ${done ? '✓ Already Checked In' : '✓ Confirm Check-in'}
          </button>
        </div>`;
    }).join('');
  };

  window.doCheckin = async function(regId) {
    const btn = document.querySelector(`[onclick="doCheckin('${regId}')"]`);
    if (btn) { btn.disabled = true; btn.textContent = 'Processing…'; }

    try {
      await set(ref(db, `vbr2026/registrations/${regId}/checkedIn`), true);
      await set(ref(db, `vbr2026/registrations/${regId}/checkedInAt`), new Date().toISOString());
      if (btn) {
        btn.textContent = '✓ Checked In';
        btn.classList.add('done');
        const badge = btn.closest('.reg-card').querySelector('.badge');
        if (badge) { badge.textContent = '✓ Checked In'; badge.className = 'badge badge-done'; }
      }
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = '✓ Confirm Check-in'; }
      alert('Check-in failed: ' + e.message);
    }
  };
</script>
</body>
</html>
