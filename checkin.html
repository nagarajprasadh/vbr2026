<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VBR 2026 — Check-in</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap');
  :root{
    --saffron:#E8500A; --saffron-dark:#B83E08;
    --green:#1A6B2F; --green-light:#EBF5EE;
    --navy:#0C1F3F; --navy-mid:#162E58;
    --ink:#1C2333; --mist:#F4F6F9; --line:#E4E8EF;
    --text-sec:#5C6478; --white:#FFFFFF; --error:#C0392B;
    --warn-bg:#FEF3C7; --warn:#92400E;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#111827}
  body{font-family:'DM Sans',sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .app{width:100%;max-width:420px;height:100%;max-height:840px;display:flex;flex-direction:column;overflow:hidden;border-radius:0;box-shadow:0 8px 48px rgba(0,0,0,.5);position:relative}
  @media(min-width:421px){.app{border-radius:16px}}

  /* HEADER — compact */
  .hdr{background:linear-gradient(135deg,var(--navy),var(--navy-mid));padding:10px 16px;position:relative;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .hdr::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--saffron) 33.3%,#fff 33.3%,#fff 66.6%,var(--green) 66.6%)}
  .hdr-title{font-family:'DM Serif Display',serif;font-size:.9rem;font-weight:400;color:#fff}
  .hdr-stats{display:flex;gap:14px;flex-shrink:0}
  .hdr-stat{text-align:center}
  .hdr-stat-v{font-size:1.1rem;font-weight:700;color:#fff;line-height:1}
  .hdr-stat-l{font-size:.58rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.04em}
  .body{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--mist)}

  /* TABS */
  .tabs{display:flex;background:var(--white);border-bottom:1px solid var(--line);flex-shrink:0}
  .tab{flex:1;padding:10px 8px;text-align:center;font-size:.78rem;font-weight:600;color:var(--text-sec);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;user-select:none}
  .tab.active{color:var(--saffron);border-bottom-color:var(--saffron);background:var(--white)}
  .tab-panel{display:none;flex:1;overflow:hidden;flex-direction:column}
  .tab-panel.active{display:flex}

  /* SCAN PANEL */
  #qr-reader{flex:1;overflow:hidden;background:#000;position:relative}
  #qr-reader video{width:100%!important;height:100%!important;object-fit:cover}
  /* Html5Qrcode default button override */
  #qr-reader__scan_region{height:100%!important}
  #qr-reader__dashboard{padding:8px!important;background:rgba(0,0,0,.6)!important}
  #qr-reader__dashboard button{
    background:var(--saffron)!important;color:#fff!important;border:none!important;
    border-radius:6px!important;padding:7px 14px!important;font-family:'DM Sans',sans-serif!important;
    font-size:.8rem!important;font-weight:600!important;cursor:pointer!important
  }
  #qr-reader__camera_selection{
    font-family:'DM Sans',sans-serif!important;font-size:.78rem!important;
    padding:5px 8px!important;border-radius:6px!important;
    border:1.5px solid rgba(255,255,255,.3)!important;
    background:rgba(0,0,0,.5)!important;color:#fff!important;width:100%!important;margin-bottom:6px!important
  }
  #qr-reader img[alt="Info icon"]{display:none!important}

  /* KB PANEL */
  #panel-kb{flex-direction:column;padding:12px}
  .kb-display{background:var(--white);border:1.5px solid var(--line);border-radius:8px;padding:12px;text-align:center;font-size:1.6rem;font-weight:700;color:var(--navy);letter-spacing:.1em;margin-bottom:8px;min-height:52px}
  .kb-hint{font-size:.72rem;color:var(--text-sec);text-align:center;margin-bottom:10px}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1}
  .kp-btn{border:1.5px solid var(--line);border-radius:8px;background:var(--white);font-family:'DM Sans',sans-serif;font-size:1.2rem;font-weight:600;color:var(--ink);cursor:pointer;transition:all .12s;display:flex;align-items:center;justify-content:center}
  .kp-btn:active{background:var(--mist);transform:scale(.95)}
  .kp-del{font-size:1.3rem;color:var(--error)}
  .kp-enter{background:var(--navy);color:#fff;border-color:var(--navy);font-size:1.3rem}
  .kp-enter:active{background:#001a45}

  /* RESULT BANNER — overlays bottom of screen */
  .result-banner{
    position:absolute;bottom:0;left:0;right:0;
    padding:14px 16px;z-index:100;
    transform:translateY(100%);transition:transform .25s ease;
    border-radius:14px 14px 0 0;
    box-shadow:0 -4px 24px rgba(0,0,0,.2);
  }
  .result-banner.show{transform:translateY(0)}
  .result-banner.ok{background:var(--green)}
  .result-banner.warn{background:var(--warn-bg);border-top:3px solid #D97706}
  .result-banner.err{background:#FDECEA;border-top:3px solid var(--error)}

  .rb-inner{display:flex;align-items:center;gap:12px}
  .rb-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.1rem;font-weight:700}
  .ok .rb-icon{background:rgba(255,255,255,.2);color:#fff}
  .warn .rb-icon{background:#FDE68A;color:var(--warn)}
  .err .rb-icon{background:#FECACA;color:var(--error)}
  .rb-body{flex:1;min-width:0}
  .rb-title{font-size:.92rem;font-weight:700;line-height:1.2}
  .ok .rb-title{color:#fff}
  .warn .rb-title{color:var(--warn)}
  .err .rb-title{color:var(--error)}
  .rb-sub{font-size:.75rem;margin-top:2px;opacity:.8;line-height:1.4}
  .ok .rb-sub{color:rgba(255,255,255,.85)}
  .warn .rb-sub{color:var(--warn)}
  .err .rb-sub{color:var(--error)}
  .rb-dismiss{font-size:.7rem;font-weight:600;cursor:pointer;opacity:.7;color:inherit;white-space:nowrap;align-self:flex-start;padding:2px 0}
  .rb-dismiss:hover{opacity:1}
</style>
</head>
<body>
<div class="app">

<!-- HEADER -->
<div class="hdr">
  <div>
    <div class="hdr-title">VBR 2026 — Check-in</div>
    <div style="font-size:.62rem;color:rgba(255,255,255,.45);margin-top:1px">30 Sep · Suan Luang Rama IX</div>
  </div>
  <div class="hdr-stats">
    <div class="hdr-stat"><div class="hdr-stat-v" id="csTotal">—</div><div class="hdr-stat-l">Total</div></div>
    <div class="hdr-stat"><div class="hdr-stat-v" id="csChecked">—</div><div class="hdr-stat-l">Done</div></div>
    <div class="hdr-stat"><div class="hdr-stat-v" id="csPending">—</div><div class="hdr-stat-l">Left</div></div>
  </div>
</div>

<!-- BODY -->
<div class="body">
  <div class="tabs">
    <div class="tab active" id="tab-scan" onclick="switchTab('scan')">📷 Camera</div>
    <div class="tab" id="tab-kb" onclick="switchTab('kb')">🔢 USB / Keyboard</div>
  </div>

  <!-- SCAN -->
  <div class="tab-panel active" id="panel-scan">
    <div id="qr-reader"></div>
  </div>

  <!-- KEYBOARD -->
  <div class="tab-panel" id="panel-kb">
    <div class="kb-display" id="kbDisplay">—</div>
    <div class="kb-hint">USB scanner auto-submits. Or type number and press ↵</div>
    <div class="keypad">
      <button class="kp-btn" onclick="kp('1')">1</button>
      <button class="kp-btn" onclick="kp('2')">2</button>
      <button class="kp-btn" onclick="kp('3')">3</button>
      <button class="kp-btn" onclick="kp('4')">4</button>
      <button class="kp-btn" onclick="kp('5')">5</button>
      <button class="kp-btn" onclick="kp('6')">6</button>
      <button class="kp-btn" onclick="kp('7')">7</button>
      <button class="kp-btn" onclick="kp('8')">8</button>
      <button class="kp-btn" onclick="kp('9')">9</button>
      <button class="kp-btn kp-del" onclick="kp('del')">⌫</button>
      <button class="kp-btn" onclick="kp('0')">0</button>
      <button class="kp-btn kp-enter" onclick="kp('enter')">↵</button>
    </div>
  </div>
</div>

<!-- RESULT BANNER -->
<div class="result-banner" id="resultBanner">
  <div class="rb-inner">
    <div class="rb-icon" id="rbIcon"></div>
    <div class="rb-body">
      <div class="rb-title" id="rbTitle"></div>
      <div class="rb-sub" id="rbSub"></div>
    </div>
    <div class="rb-dismiss" onclick="dismissBanner()">✕ Next</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
firebase.initializeApp({
  apiKey:            "AIzaSyD10Uvnqg6Q_kAQbOdjEjhtY7QBnP8vFGc",
  authDomain:        "viksitbharatrunbkk2026.firebaseapp.com",
  databaseURL:       "https://viksitbharatrunbkk2026-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:         "viksitbharatrunbkk2026",
  storageBucket:     "viksitbharatrunbkk2026.firebasestorage.app",
  messagingSenderId: "732438557121",
  appId:             "1:732438557121:web:c41053238a31f5c2af3f40"
});
const db = firebase.database();

// ── Live stats ──
db.ref('vbr2026/registrations').on('value', snap => {
  const all     = snap.val() || {};
  const regs    = Object.values(all);
  const total   = regs.length;
  const checked = regs.filter(r => r.checkedIn).length;
  document.getElementById('csTotal').textContent   = total;
  document.getElementById('csChecked').textContent = checked;
  document.getElementById('csPending').textContent = total - checked;
});

// ── Banner ──
let bannerTimer = null;

function showBanner(type, icon, title, sub) {
  clearTimeout(bannerTimer);
  document.getElementById('rbIcon').textContent  = icon;
  document.getElementById('rbTitle').textContent = title;
  document.getElementById('rbSub').textContent   = sub;
  const b = document.getElementById('resultBanner');
  b.className = 'result-banner show ' + type;
  // Auto dismiss after 4s
  bannerTimer = setTimeout(dismissBanner, 4000);
}

function dismissBanner() {
  clearTimeout(bannerTimer);
  document.getElementById('resultBanner').classList.remove('show');
  lastScanned = null;
  kbBuf = ''; updateKb();
  if (currentTab === 'scan') resumeScanner();
}

// ── Process QR / number ──
let lastScanned = null;
let processing  = false;

async function process(text) {
  text = String(text).trim();
  if (!text || text === lastScanned || processing) return;
  lastScanned = text;
  processing  = true;

  if (navigator.vibrate) navigator.vibrate(80);

  try {
    const allSnap = await db.ref('vbr2026/registrations').once('value');
    const all = allSnap.val() || {};
    let foundKey = null, foundData = null;

    // Match regNumber (numeric)
    const num = parseInt(text);
    if (!isNaN(num)) {
      const hit = Object.entries(all).find(([k,v]) => v.regNumber === num);
      if (hit) { foundKey = hit[0]; foundData = hit[1]; }
    }
    // Match email
    if (!foundKey && text.includes('@')) {
      const hit = Object.entries(all).find(([k,v]) => v.email && v.email.toLowerCase() === text.toLowerCase());
      if (hit) { foundKey = hit[0]; foundData = hit[1]; }
    }
    // Direct Firebase key
    if (!foundKey && all[text]) { foundKey = text; foundData = all[text]; }

    if (!foundKey) {
      showBanner('err', '!', 'Not Found', 'QR code not in system. Check the pass and try again.');
      processing = false;
      setTimeout(() => { lastScanned = null; if (currentTab === 'scan') resumeScanner(); }, 3000);
      return;
    }

    const p = foundData.participant || {};
    const name = p.name || '—';
    const size = p.size || '—';

    if (foundData.checkedIn) {
      const t = foundData.checkedInAt ? new Date(foundData.checkedInAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
      showBanner('warn', '✓', 'Already Checked In', `${name} · ${size} · Checked in at ${t}`);
      processing = false;
      return;
    }

    // Auto check-in immediately — no confirm needed
    await db.ref('vbr2026/registrations/' + foundKey).update({
      checkedIn: true,
      checkedInAt: new Date().toISOString()
    });

    showBanner('ok', '✓', `${name} — ${size}`, `Reg #${foundData.regNumber || ''} · Checked in ✓`);

  } catch(e) {
    showBanner('err', '!', 'Error', e.message);
    setTimeout(() => { lastScanned = null; }, 2000);
  }
  processing = false;
}

// ── Scanner ──
let qrScanner = null;
let currentTab = 'scan';

function startScanner() {
  stopScanner();
  qrScanner = new Html5Qrcode('qr-reader');
  qrScanner.start(
    { facingMode: 'environment' },
    { fps: 12, qrbox: { width: 200, height: 200 }, aspectRatio: 1.333 },
    (text) => { pauseScanner(); process(text); },
    () => {}
  ).catch(() => {
    document.getElementById('qr-reader').innerHTML =
      '<div style="padding:30px;text-align:center;color:rgba(255,255,255,.6);font-size:.82rem">Camera unavailable.<br>Use Keyboard tab instead.</div>';
  });
}

function stopScanner()   { if (qrScanner) { qrScanner.stop().catch(()=>{}); qrScanner = null; } }
function pauseScanner()  { if (qrScanner) qrScanner.pause(true); }
function resumeScanner() { if (qrScanner) qrScanner.resume(); }

// ── Keyboard / USB ──
let kbBuf = '';

function updateKb() {
  document.getElementById('kbDisplay').textContent = kbBuf || '—';
}

function kp(key) {
  if (key === 'del')   { kbBuf = kbBuf.slice(0,-1); updateKb(); return; }
  if (key === 'enter') { if (kbBuf.length >= 1) { process(kbBuf); } return; }
  kbBuf += key; updateKb();
}

// Physical keyboard / USB scanner
document.addEventListener('keydown', e => {
  if (currentTab !== 'kb') return;
  if (e.key === 'Enter' || e.keyCode === 13) { kp('enter'); return; }
  if (e.key === 'Backspace') { kp('del'); return; }
  if (/^[-A-Za-z0-9_@.]$/.test(e.key)) { kbBuf += e.key; updateKb(); }
});

// ── Tab switch ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('panel-' + tab).classList.add('active');
  dismissBanner();
  if (tab === 'scan') startScanner(); else stopScanner();
}

// ── Start ──
startScanner();
</script>
</body>
</html>
